name: Daily AI Worklog Generator

on:
  schedule:
    # Runs at 21:00 UTC every day
    - cron: '0 21 * * *'
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to fetch full git history/diffs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Worklog Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/generate_worklog.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Check if WORKLOG.md was modified before committing
          if git diff --name-only | grep -q "WORKLOG.md"; then
            git add WORKLOG.md
            git commit -m "docs: auto-update daily AI worklog [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi